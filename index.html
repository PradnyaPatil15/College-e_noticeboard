<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Noticeboard | College Portal</title>

<!-- Bootstrap & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}
header {
  position: relative;
  height: 100vh;
  background: url('{{ url_for("static", filename="images/college_banner.jpg") }}')
              no-repeat center center/cover;
  color: white;
  text-align: center;
}

/* Overlay gradient */
header::before {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(135deg,
              rgba(0,0,0,0.7),
              rgba(0,50,150,0.6));
  z-index: 0;
}

/* Admin button */
.admin-btn {
  position: absolute;
  top: 20px;
  right: 25px;
  z-index: 2;
  background: rgba(220,53,69,0.4);
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 30px;
  color: white;
  padding: 8px 18px;
  text-decoration: none;
  backdrop-filter: blur(10px);
  transition: 0.3s ease;
  font-weight: 500;
}
.admin-btn:hover {
  background: rgba(220,53,69,0.8);
  transform: scale(1.05);
}

/* Main content */
.header-content {
  position: relative;
  z-index: 1;
  top: 50%;
  transform: translateY(-50%);
  animation: fadeIn 1.2s ease-in-out both;
}

/* Title and subtitle */
header h1 {
  font-size: 3rem;
  font-weight: 700;
  text-shadow: 3px 3px 8px rgba(0,0,0,0.5);
}
header p {
  font-size: 1.2rem;
  color: #f8f9fa;
  margin-bottom: 25px;
}

/* Student buttons */
.btn-glass {
  display: inline-block;
  margin: 10px;
  padding: 12px 35px;
  border-radius: 50px;
  font-size: 1rem;
  font-weight: 500;
  color: white;
  border: 2px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  transition: 0.3s ease;
  text-decoration: none;
}
.btn-glass:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 15px rgba(255,255,255,0.3);
  border-color: white;
}
.btn-signup { background: rgba(13,110,253,0.3); }
.btn-signup:hover { background: rgba(13,110,253,0.6); }

.btn-login { background: rgba(25,135,84,0.3); }
.btn-login:hover { background: rgba(25,135,84,0.6); }

/* Animation */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(-50%); }
}

/* Footer */
footer {
  position: absolute;
  bottom: 15px;
  width: 100%;
  text-align: center;
  font-size: 0.9rem;
  color: rgba(255,255,255,0.7);
}
</style>
</head>

<body>

<header>

  <!-- Admin Login -->
  <a href="{{ url_for('admin_login') }}" class="admin-btn">
    <i class="bi bi-shield-lock-fill"></i> Admin
  </a>

  <!-- Main content -->
  <div class="header-content">
    <h1><i class="bi bi-megaphone-fill"></i> College E-Noticeboard</h1>
    <p>Stay updated with all official college announcements</p>

    <a href="{{ url_for('signup') }}" class="btn-glass btn-signup">
      <i class="bi bi-person-plus-fill"></i> Student Sign Up
    </a>

    <a href="{{ url_for('login') }}" class="btn-glass btn-login">
      <i class="bi bi-box-arrow-in-right"></i> Student Login
    </a>
  </div>

  <footer>
    © {{ current_year if current_year else 2026 }}
    College E-Noticeboard | All Rights Reserved
  </footer>

</header>

</body>
</html>
