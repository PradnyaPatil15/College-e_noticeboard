<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Notices | e-NoticeBoard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #00b894, #0984e3);
      min-height: 100vh;
      padding: 40px 15px;
      color: #333;
    }
    .container { max-width: 900px; margin: auto; }
    .page-header {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px 30px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      color: #fff;
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-logout {
      background: #d63031;
      color: #fff;
      border-radius: 8px;
      padding: 8px 14px;
      text-decoration: none;
    }
    .notice-card {
      background: rgba(255,255,255,0.9);
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      margin-bottom: 25px;
      overflow: hidden;
    }
    .notice-header {
      background: linear-gradient(135deg, #00b894, #0984e3);
      color: #fff;
      padding: 14px 20px;
      font-weight: 600;
      font-size: 1.2rem;
    }
    .notice-body { padding: 20px; }
    .notice-date {
      font-size: 0.9rem;
      color: #555;
      margin-top: 10px;
      font-style: italic;
    }
    .btn-attachment {
      background: linear-gradient(135deg, #0984e3, #00b894);
      color: #fff;
      border-radius: 8px;
      padding: 6px 12px;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="page-header">
    <h2><i class="bi bi-megaphone-fill"></i> Student Notices</h2>
    <a href="{{ url_for('logout') }}" class="btn-logout">
      <i class="bi bi-box-arrow-right"></i> Logout
    </a>
  </div>

  {% if notices %}
    {% for n in notices %}
      <div class="notice-card">
        
        <!-- TITLE -->
        <div class="notice-header">
          <i class="bi bi-bell-fill"></i> {{ n['title'] }}
        </div>

        <div class="notice-body">
          
          <!-- BODY -->
          <p>{{ n['body'] }}</p>

          <!-- ATTACHMENT -->
          {% if n['filename'] %}
            <a href="{{ url_for('static', filename='uploads/' ~ n['filename']) }}"
               class="btn-attachment" download>
              <i class="bi bi-paperclip"></i> Download Attachment
            </a>
          {% endif %}

          <!-- DATE -->
          {% if n['date'] %}
            <div class="notice-date">
              📅 Published on: {{ n['date'] }}
            </div>
          {% endif %}

        </div>
      </div>
    {% endfor %}
  {% else %}
    <div class="alert alert-info text-center">
      <i class="bi bi-info-circle"></i> No notices available.
    </div>
  {% endif %}
</div>

</body>
</html>
