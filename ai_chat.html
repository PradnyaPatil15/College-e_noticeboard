<!DOCTYPE html>
<html>
<head>

    <title>AI Notice Assistant</title>

    <style>

        body {
            font-family: Arial;
            background: linear-gradient(135deg,#0984e3,#00b894);
            min-height:100vh;
            padding:40px;
        }

        .container {
            max-width:800px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:20px;
        }

        input {
            width:75%;
            padding:15px;
            border-radius:10px;
            border:1px solid #ccc;
        }

        button {
            padding:15px 25px;
            border:none;
            border-radius:10px;
            background:#0984e3;
            color:white;
        }

        .answer {
            margin-top:25px;
            padding:20px;
            background:#f1f2f6;
            border-radius:12px;
        }

        .notice {
            margin-top:15px;
            padding:15px;
            background:#dfe6e9;
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🤖 AI Notice Assistant</h1>

    <p>Ask anything about college notices.</p>

    <form method="POST">

        <input
            type="text"
            name="question"
            placeholder="e.g. When is the internal exam?"
            required
        >

        <button type="submit">
            Ask AI
        </button>

    </form>


    {% if answer %}

    <div class="answer">

        <h3>🤖 AI Answer</h3>

        <p>{{ answer }}</p>

    </div>

    {% endif %}


    {% if results %}

        <h3>🔎 Relevant Notices</h3>

        {% for score, notice in results %}

        <div class="notice">

            <h4>{{ notice['title'] }}</h4>

            <p>{{ notice['body'] }}</p>

            <small>
                📅 {{ notice['date'] }}
            </small>

        </div>

        {% endfor %}

    {% endif %}

</div>

</body>
</html>
