<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | e-NoticeBoard</title>

<!-- Bootstrap + Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
  min-height: 100vh;
  margin: 0;
  background: linear-gradient(135deg, #00b894, #0984e3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Poppins", sans-serif;
  overflow-y: auto;
  padding: 40px 15px;
}

/* White card */
.login-card {
  width: 400px;
  background: #ffffff;
  border-radius: 18px;
  padding: 35px 40px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  animation: fadeUp 0.7s ease;
}

.login-card h3 {
  font-weight: 700;
  text-align: center;
  color: #0d6efd;
  margin-bottom: 25px;
}

.input-group-text {
  background: #e9f3ff;
  border: none;
  border-radius: 10px 0 0 10px;
  color: #0d6efd;
}

.form-control {
  border-radius: 0 10px 10px 0 !important;
  border: none !important;
  background: #f8faff;
  box-shadow: none !important;
}

.form-control:focus {
  background: #f1f7ff;
  border: 1px solid #0d6efd !important;
}

/* Button */
.btn-login {
  background: linear-gradient(135deg, #0d6efd, #00b894);
  border: none;
  color: white;
  border-radius: 10px;
  padding: 10px;
  font-size: 1.1rem;
  font-weight: 600;
  transition: 0.3s;
  width: 100%;
}

.btn-login:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(13,110,253,0.4);
}

/* Animation */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Flash message */
.flash-msg {
  border-radius: 10px;
  text-align: center;
  font-weight: 500;
}
</style>
</head>

<body>

<div class="login-card shadow-lg">
  <h3>
    <i class="bi bi-shield-lock-fill me-2"></i>Admin Login
  </h3>

  <!-- Flash Messages (app.py compatible) -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} flash-msg">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <!-- app.py admin_login route -->
  <form method="POST" action="{{ url_for('admin_login') }}">

    <div class="mb-3 input-group">
      <span class="input-group-text">
        <i class="bi bi-envelope-fill"></i>
      </span>
      <input type="email"
             name="email"
             class="form-control"
             placeholder="Email Address"
             required>
    </div>

    <div class="mb-3 input-group">
      <span class="input-group-text">
        <i class="bi bi-key-fill"></i>
      </span>
      <input type="password"
             name="password"
             class="form-control"
             placeholder="Password"
             required>
    </div>

    <button type="submit" class="btn-login mt-2">
      <i class="bi bi-box-arrow-in-right"></i> Login
    </button>

  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
