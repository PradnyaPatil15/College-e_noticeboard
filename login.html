<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Login | e-NoticeBoard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #00b894, #0984e3);
      padding: 40px 15px;
    }

    .login-box {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      padding: 35px 40px;
      width: 400px;
      animation: fadeUp 0.8s ease;
    }

    .login-box h3 {
      text-align: center;
      font-weight: 700;
      color: #00b894;
      margin-bottom: 25px;
    }

    .input-group-text {
      background: #e9f3ff;
      border: none;
      border-radius: 10px 0 0 10px;
      color: #00b894;
    }

    .form-control {
      border-radius: 0 10px 10px 0 !important;
      border: none !important;
      background: #f8faff;
    }

    .form-control:focus {
      background: #f1f7ff;
      border: 1px solid #00b894 !important;
      box-shadow: none !important;
    }

    .btn-success {
      background: linear-gradient(135deg, #00b894, #0984e3);
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: 600;
      font-size: 1.1rem;
      color: #fff;
      transition: 0.3s;
      width: 100%;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 184, 148, 0.4);
    }

    a {
      color: #0984e3;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
      color: #00b894;
    }

    .alert {
      border-radius: 10px;
      text-align: center;
      font-size: 0.9rem;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="login-box shadow-lg">
    <h3><i class="bi bi-person-circle me-2"></i> Student Login</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="alert alert-{{category}}">{{msg}}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
      </div>

      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-success mt-2">
        <i class="bi bi-box-arrow-in-right"></i> Login
      </button>

      <p class="mt-3 text-center">
        <a href="{{ url_for('forgot_password') }}">
          <i class="bi bi-unlock"></i> Forgot Password?
        </a>
      </p>

      <p class="text-center">
        New user? 
        <a href="{{ url_for('signup') }}">
          <i class="bi bi-person-plus"></i> Signup
        </a>
      </p>
    </form>
  </div>

</body>
</html>
